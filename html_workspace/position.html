<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>position 연습</title>
</head>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  div{
    width: 200px;
    height: 200px;
    line-height: 200px;
    text-align: center;
  }
  #box1{
    background: tomato;
  }
  #box2{
    background: royalblue;
    position: absolute;
    top: 500px;
    left: 100px;
  }
  #box3{
    background: yellowgreen;
    position: relative;
    top: 50px;
    left: 50px;
  }
  #box4{
    background: olive;
    position: fixed;
    top: 0;
    right: 0;
  }
  #parent{
    background: maroon;
    position: relative;
    left: 300px;
  }
  #child{
    background: plum;
    width: 50px;
    height: 50px;
    position: absolute;
    top: 10px;
    /* left: 20px; */
    right: 20px;
  }
</style>
<body>
  <div id="box1">box1</div>
  <div id="box2">box2</div>
  <div id="box3">box3</div>
  <div id="box4">box4</div>
  <div id="parent">
    <div id="child"></div>
  </div>
</body>
</html>
