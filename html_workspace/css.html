<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css 연습</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    p{
      font-style: italic;
    }
    .accent{
      padding: 5px;
      border: 1px solid #00ffbf;
      color: #222;
    }
    .bg{
      background-color: #ddd;
    }
    #container{
      width: 500px;
      margin: 10px auto;
      padding: 10px;
      border: 1px solid #000;
    }
    h3, h4{
      color: darkred;
    }
    </style>
</head>
<body>
  <h1 class="accent bg">CSS3</h1>
  <p class="accent">css3</p>
  <p>css3</p>
  <p>css3</p>
  <p>css3</p>
  <p>css3</p>
  <p>css3</p>
  <p>css3</p>
  <p>css3</p>
  
  <div id="container">
    <h2 class="bg">레드향</h2>
    <p>레드향은 붉은 빛이 돌아 레드향이라 불린다.</p>
    <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3베 더 크고, 과육이 붉고 통통하다.</p>
    <p>비타민 C와 비타민 P가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>
  </div>
  <div>
    <h2 class="bg">청포도</h2>
    <h3>css3</h3>
    <h4>css3</h4>
  </div>
</body>
</html>
