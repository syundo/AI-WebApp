<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>box 연습</title>
  <style>
    *{box-sizing: border-box;}
    #top{
      background-color: rgb(250, 100, 50);
      width: 500px;
      padding: 20px;
    }
    span{
      background-color: rgba(150, 200, 50, 0.8);
      padding: 20px;
    }
    #middle{
      background-color: royalblue;
      width: 50%;
      height: 300px;
      padding: 10px;
      float: left;
    }
    #last{
      background-color: lightsalmon;
      width: 50%;
      height: 300px;
      padding: 10px;
      float: left;
    }
    #box1{
      border: 1px solid black;
      width: 200px;
      height: 500px;
      margin: auto;
      text-align: center;
      line-height: 500px;
    }
  </style>
</head>
<body>
  <div id="top">
    HTML5
  </div>
  캐스캐이딩 스타일 시트
  <br>
  <span>CSS3</span>
  캐스캐이딩 스타일 시트
  <br>
  <div id="middle">HTML</div>
  <div id="last">CSS</div>
  <hr>
  <div id="box1">box1</div>
</body>
</html>
