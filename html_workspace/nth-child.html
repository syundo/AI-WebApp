<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nth-child, nth-of-type</title>
  <style>
    div:nth-child(1){color: tomato;}
    div:nth-child(2){color: yellowgreen;}
    div:nth-child(3){color: royalblue;}
    /* div:nth-of-type(1){color: tomato;} */
    /* div:nth-of-type(2){color: yellowgreen;} */
    /* div:nth-of-type(3){color: royalblue;} */
  </style>
</head>
<body>
  <span>box1</span>
  <div>box2</div>
  <div>box3</div>
</body>
</html>
