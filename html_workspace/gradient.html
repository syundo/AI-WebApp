<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gradinent 연습</title>
  <style>
    div{
      box-sizing: border-box;
      line-height: 500px;
      text-align: center;
      font-size: 3rem;
      font-weight: bold;
    }
    .linear{
      width:300px;
      height:300px;
      border-radius: 50%;
      background: lemonchiffon;
      background: linear-gradient(150deg, rgb(155, 200, 50), rgb(255, 100, 70), rgb(255, 100, 100));
    }
    .radial{
      width:10px;
      height:10px;
      border-radius: 50%;
      background: radial-gradient(circle at 20% 20%, white, blue);
      box-shadow: 1px 1px 1px gray;
    }
  </style>
</head>
<body>
  <div class="linear"></div>
  <h2>bullet만들기</h2>
  <div class="radial"></div>
</body>
</html>
