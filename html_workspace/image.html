<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>img 연습</title>
</head>
<body>
  <!-- Images________________________________________________________________________________ -->
  <img src="images/html.jpg" alt="html" width="100%">
  <figure>
    <img src="images/spring.png" alt="제주의 봄">
    <img src="images/summer.png" alt="제주의 여름">
    <img src="images/fall.png" alt="제주의 가을">
    <img src="images/winter.png" alt="제주의 겨울">
    <figcaption>제주도의 사계절</figcaption>
  </figure>

  <!-- Medias________________________________________________________________________________ -->
  <object width="700" height="500" data="product.pdf"></object>
  <video src="medias/salad.mp4" controls width="700" autoplay muted loop></video>
  <!-- 비디오를 올릴 때는 용량을 줄여야 함 -->
  <!-- 유튜브를 활용하는 방법 -->
  <iframe width="862" height="485" src="https://www.youtube.com/embed/2mkOUrmsUmA" title="Playlist | 겨울을 담은, 재즈" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen autoplay muted loop></iframe>
</body>
</html>
