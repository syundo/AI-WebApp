<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
</head>
<body>
  <div id="container">
    <h1>회원가입을 환영합니다!</h1>

    <form action="register.jsp" method="post">
      <input type="hidden" name="type" value="direct">
      <ul>
        <li>
          <label for="uid">아이디</label>
          <input type="text" id="uid" placeholder="6~20글자 사이로 입력" required autofocus>
        </li>
        <li>
          <label for="umail">이메일</label>
          <input type="email" id="email">
        </li>
        <li>
          <label for="pwd1">비밀번호</label>
          <input type="password" id="pwd1" required>
        </li>
        <li>
          <label for="pwd2">비밀번호 확인</label>
          <input type="password" id="pwd2" required>
        </li>
        <li>
          <input type="radio" name="mailing" id="mailing_y" value="mailing_yes" checked>
          <label for="mailing_y">메일수신</label>
          <input type="radio" name="mailing" id="mailing_n" value="mailing_no">
          <label for="mailing_n">메일수신 안 함</label>
        </li>
        <li>
          <label for="birth">생년월일</label>
          <input type="date" id="birth">
        </li>
        <li>
          <label for="picture">프로필 사진</label>
          <input type="file" id="picture">
        </li>
        <li>
          <label for="job">직업</label>
          <select id="job">
            <option value="job1">학생</option>
            <option value="job2">직장인</option>
            <option value="job3">공무원</option>
            <option value="job4">가정주부</option>
            <option value="jobetc">기타</option>
          </select>
        </li>
        <li>
          <label for="road">가입경로</label>
          <input type="checkbox" name="road1" value="sns">SNS
          <input type="checkbox" name="road1" value="blog">블로그
          <input type="checkbox" name="road1" value="site">포털사이트
        </li>
      </ul>
      <div>
        <input type="submit" value="가입하기">
        <input type="reset" value="초기화">
        <button type="button">fake</button>
        <button>join</button>
        <button type="reset">reset</button>
      </div>
    </form>
  </div>
</body>
</html>
