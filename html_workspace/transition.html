<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition 연습</title>
  <style>
    #parent{
      background: orangered;
      width: 500px;
      height: 500px;
      position: relative;
    }
    #child{
      background: royalblue;
      width: 200px;
      height: 200px;
      position: absolute;
      left: 300px;
      opacity: 0;
      transition: 0.5s;
    }
    #parent:hover #child{
      transform: translateX(200px);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="parent">
    <div id="child"></div>
  </div>
</body>
</html>
