<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript 연습4</title>
  <script>
    let name;
    console.log(name);
    console.log(typeof name);
    name = 10;
    console.log(name);
    console.log(typeof name);
    name = "홍길동"; // 묵시적 형변환. 자동 형변환
    console.log(name);
    console.log(typeof name);
    
    console.log(0 == 0.00); // 값만 같으면 true
    console.log(null == "");
    console.log(null == undefined);
    console.log(null === undefined); // 값과 타입이 같아야 true
    
    let student={name:"홍길동",department:"컴퓨터공학과"};
    console.log(student.name); // 학생의 이름
    console.log(student.department); // 학생의 학과
    console.log(typeof student);

    console.log(typeof String(10)); // number → string으로 변환
    console.log(typeof Boolean(0)); // number → boolean으로 변환
    console.log(parseInt("1234")); // 명시적 형변환
    console.log(typeof parseInt("1234")); // srting → number(int)으로 변환
    console.log(parseFloat("1234.567")); // 명시적 형변환
    console.log(typeof parseFloat("1234.567")); // srting → number(float)으로 변환
    console.log(10-"값"); // NaN: Not a Number(오류 메세지. 숫자가 아니라는 뜻)
    
    var a=10;
    var b=2;
    console.log(a*b);
    console.log(a/b);
    console.log(a%b);
    console.log(a**b);
    
    let c=10;
    let d=20;
    let e=30;
    
    c=d=e;
    console.log(c);
    console.log(d);
    console.log(e);

    console.log(a+=b); // a=a+b
    console.log(a-=b); // a=a-b
    console.log(a*=b); // a=a*b
    console.log(a/=b); // a=a/b
    console.log(a%=b); // a=a%b
    
    var x=10;
    console.log(x++); // x값을 먼저 사용해서 출력한 다음 x값을 1 증가
    console.log(x);
    let y=10;
    console.log(++y); // y값을 먼저 1 증가시킨 다음 y값을 사용해서 출력
    console.log(y);
    var z=10;
    let result=30;
    result=z++; // z를 먼저 사용해서 result에 대입한 후 z값을 1 증가
    console.log(result);
    console.log(z);
    
    a=10;
    b=2;
    console.log(x!=y);
    console.log(x!==y);
    console.log(a>b);
    console.log(a>=b);
    console.log(a<b);
    console.log(a<=b);
    
    let score1=10;
    let score2=20;
    let score3=30;
    let score4=40;
    console.log(score1<score2 && score3<score4); // true && true → true
    console.log(score1<score2 && score3>score4); // true && false → false
    console.log(score1>score2 || score3>score4); // false || false → false
    console.log(score1>score2 || score3<score4); // false || true → true

    let scorex=-1000;
    console.log(scorex<<1); // scorex*2과 동일
    console.log(scorex<<2); // scorex*2²과 동일
    console.log(scorex<<3); // scorex*2³과 동일
    console.log(scorex>>1); // scorex/2과 동일
    console.log(scorex>>2); // scorex/2²과 동일
    console.log(scorex>>3); // scorex/2³과 동일
    console.log(scorex>>>1); // 1의 보수와 동일
    
    console.log((score2>score3)?score1:score4);
    console.log((score2<score3)?score1:score4);
  </script>
</head>
<body>
  
</body>
</html>
