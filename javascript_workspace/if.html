<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조건문 연습</title>
  <script>
    let score=97;

    // if문
    if(score>=60) {
      console.log("합격");
    }
    else {
      console.log("불합격");
    }

    // 삼항 연산자에 의한 조건문
    console.log((score>=70)?"재수강가능":"재수강불가능");

    // 다중 else if문
    if(score>=90) {
      console.log("A");
    }
    else if(score>=80) {
      console.log("B");
    }
    else if(score>=70) {
      console.log("C");
    }
    else if(score>=60) {
      console.log("D");
    }
    else {
      console.log("F");
    }

    let department="자율전공";
    
    // switch문
    switch(department) {
      case "컴퓨터공학":
        console.log("프로그래밍 공부를 합니다.");
        break;
      case "철학":
        console.log("동서양 고대부터 현대까지 철학자들의 사상을 공부합니다.");
        break;
      case "자율전공":
        console.log("1학년 동안 자신의 전공을 깊이있게 고민해서 결정합니다.");
        break;
      default:
        console.log("교학처에 문의하세요.");
    }

    console.log(score/10);
    switch(parseInt(score/10)){
      case 10:case 9:case 8:case 7:case 6: // 10 or 9 or 8 or 7 or 6 이면
        console.log("합격");
        break;
      default:
        console.log("불합격");
    }
    switch(parseInt(score/10)) {
      case 10:
      case 9:
        console.log("A");
        break;
      case 8:
        console.log("B");
        break;
      case 7:
        console.log("C");
        break;
      default:
        console.log("F");
    }
  </script>
</head>
<body>
  
</body>
</html>
