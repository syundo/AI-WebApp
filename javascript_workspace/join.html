<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <script>
    function check(){
      if(document.joinForm.id.value=="") {
        alert("id를 입력하세요.");
        document.joinForm.id.focus();
        return;
      }
      if(document.joinForm.password.value=="") {
        alert("비밀번호를 입력하세요.");
        document.joinForm.password.focus();
        return;
      }
      if(document.joinForm.password.value != document.joinForm.passwordcheck.value) {
        alert("비밀번호 확인이 일치하지 않습니다.");
        document.joinForm.passwordcheck.select();
        return;
      }
      if(document.joinForm.email.value.indexof("@") == -1) {
          alert("email이 올바른 형식이 아닙니다.");
          document.joinForm.email.select();
          return;
        }
      // if(document.joinForm.email.value != "") {
      //   if(document.joinForm.email.value.indexof("@") == -1) {
      //     alert("email이 올바른 형식이 아닙니다.");
      //     document.joinForm.email.select();
      //     return;
      //   }
      // }

      document.joinForm.submit(); // form에 입력한 값 전송
    }

    function check2(){
      if(document.joinForm.id.value=="") {
        alert("id를 입력하세요.");
        document.joinForm.id.focus();
        return false; // 함수 종료. return값은 함수를 호출한 곳으로 간다
      }
      if(document.joinForm.password.value=="") {
        alert("비밀번호를 입력하세요.");
        document.joinForm.password.focus();
        return false;
      }
      if(document.joinForm.password.value != document.joinForm.passwordcheck.value) {
        alert("비밀번호 확인이 일치하지 않습니다.");
        document.joinForm.passwordcheck.select();
        return false;
      }
      if(document.joinForm.email.value != "") {
        if(document.joinForm.email.value.indexof("@") == -1) {
          alert("email이 올바른 형식이 아닙니다.");
          document.joinForm.email.select();
          return false;
        }
      }
    }
  </script>
</head>
<body>
  <div id="container">
    <h1>회원가입을 환영합니다!</h1>

    <form action="register.jsp" method="post" name="joinForm" onsubmit=" return check2()">
      <input type="hidden" name="type" value="direct">
      <ul>
        <li>
          <label for="uid">아이디</label>
          <input type="text" id="uid"name="id" placeholder="6~15글자 사이로 입력" autofocus>
        </li>
        <li>
          <label for="uemail">이메일</label>
          <input type="text" id="uemail" name="email">
        </li>
        <li>
          <label for="pwd">비밀번호</label>
          <input type="password" id="pwd" name="password">
        </li>
        <li>
          <label for="pwdcheck">비밀번호 확인</label>
          <input type="password" id="pwdcheck" name="passwordcheck">
        </li>
        <li>
          <input type="radio" id="mailing_y" name="mailing" value="mailing_yes" checked>
          <label for="mailing_y">메일수신</label>
          <input type="radio" id="mailing_n" name="mailing" value="mailing_no">
          <label for="mailing_n">메일수신 안 함</label>
        </li>
        <li>
          <label for="birth">생년월일</label>
          <input type="date" id="birth" name="birth">
        </li>
        <li>
          <label for="picture">프로필 사진</label>
          <input type="file" id="picture" name="picture">
        </li>
        <li>
          <label for="job">직업</label>
          <select id="job">
            <option value="job1">학생</option>
            <option value="job2">직장인</option>
            <option value="job3">공무원</option>
            <option value="job4">가정주부</option>
            <option value="jobetc">기타</option>
          </select>
        </li>
        <li>
          <label for="road">가입경로</label>
          <input type="checkbox" name="road1" value="sns">SNS
          <input type="checkbox" name="road2" value="blog">블로그
          <input type="checkbox" name="road3" value="site">포털사이트
        </li>
        <li>
          <label for="reson">가입 동기</label><br>
          <textarea id="reson" name="joinreson" cols="50" rows="5"></textarea>
        </li>
      </ul>
      <div>
        <button type="button" value="확인" onclick="check()">확인</button>
        <input type="submit" value="가입하기">
        <input type="reset" value="초기화">
        <button type="button" onclick="check()">fake→join(by onclick)</button>
        <button>join</button>
        <button type="reset">reset</button>
      </div>
    </form>
  </div>
</body>
</html>
