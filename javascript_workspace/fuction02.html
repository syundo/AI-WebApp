<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>함수 연습2</title>
  <script>
    /* 함수를 만든는 여러가지 방법 */
    // 1. fuction 키워드 사용
    function f1(x) {
      return x+10;
    }
    document.write(f1(7)+"<br>");
    
    // 2. 익명함수(anonymous fuction)
    // → 특정 조건에서 자동으로 호출되는 함수
    // → 직접 호출이 불가능하므로 reference 변수를 이용
    // → reference 변수가 함수의 이름 역할
    let f2 = function () {
      document.write("hello");
    }
    f2();
    document.write("<br>");
    
    // 3. 람다식. 화살표함수
    // → 익명함수와 비슷하게 이름이 없음
    // → reference를 사용해서 호출 가능
    let f3 = (x)=>{
      return x+100;
    }
    document.write(f3(16)+"<br>");
  </script>
</head>
<body>
  
</body>
</html>
  </script>
