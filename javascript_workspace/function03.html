<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    function greetFunc() {
      console.log('Hello, World!');
    }
    greetFunc();
    let greeting = greetFunc;
    greeting();

    // 함수의 parameter 값이 함수를 가리키는 reference
    function parentFunc(callBack) {
      console.log('parent');
      callBack();
    }
    function childFunc() {
      console.log('child');
    }
    parentFunc(childFunc); // 함수의 이름(reference)을 전달

    function repeat(count, callBack) {
      for (let idx = 0; idx < count; idx++) {
        callBack(idx + 1);
      }
    }
    // callback 함수를 parameter 자리에 직접 작성 가능
    repeat(5, function(count) {
      console.log(count * 5);
    })

    let isConfirm = true;
    function confirm(onYes, onNo) {
      if (isConfirm) 
        onYes();
      else 
        onNo();
    }
    // 함수 호출. parameter 자리에 직접 callback 함수 작성 가능
    confirm(
      () => console.log('yes'),
      () => console.log('no')
    )

    function foo() {
      console.log('foo');
      // inner function
      function bar() {
        console.log('bar');
      }
      bar(); // inner function bar() 호출 가능
    }
    // bar(); // foo()의 inner function bar() 호출 불가
    foo();
  </script>
</head>
<body>
  
</body>
</html>
