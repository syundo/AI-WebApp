<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반복문 연습</title>
  <script>
    let i=1;
    let j=1;

    // while문(조건에 해당되는 동안 실행)
    while(i<4) {
      console.log(i);
      i++; // 없으면 무한루프에 빠짐. 주의
    }

    // do while문(조건에 관계없이 실행을 1번 하고 시작)
    do {
      console.log(j);
      j++; // 없으면 무한루프. 주의
    } while(j<4);

    // for문
    for(var k=0; k<10; k++) {
      document.write(k+"<br>");
    }
    
    var arr = [10, 20, 30];
    
    for (var k = 0; i < arr.length; i++) { // 배열 arr의 모든 요소의 인덱스(index)를 출력함.
      console.log(arr[i]);
    }
    // for/in문
    for (let index in arr) { // 위와 같은 동작을 하는 for / in 문
      console.log(arr[index]);
    }
    // for/of문
    for (let value of arr) { // 위와 같은 동작을 하는 for / of 문
      console.log(value);
    }
  </script>
</head>
<body>
  
</body>
</html>
