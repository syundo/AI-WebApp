<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>addClass 연습</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    .lined {
      text-decoration: line-through;
      color: lightgray;
    }
  </style>
  <script>
    $(function() {
      $("#addBtn").on("click", function() {
        $("#first, #third").addClass("lined");
      });
      $("#removeBtn").on("click", function() {
        $("#first, #third").removeClass("lined");
      });
      $("#toggleBtn").on("click", function() {
        $("#first, #third").toggleClass("lined");
      });
      // $("#hasBtn").on("click", function() {
      //   $("#first").hasClass("lined");
      //   console.log($("#first").hasClass("lined"));
      // });
      $("#hasBtn").on("click", function() {
        let result = $("#first").hasClass("lined") ? "first jQuery에 .lined 존재" : "first jQuery에 .lined 확인 불가";
        $("#resultText").text(result);
      });
    });
  </script>
</head>
<body>
  <h1>addClass, removeClass, toggleClass</h1>
  <p id="first">jQuery</p>
  <p id="second">jQuery</p>
  <p id="third">jQuery</p>
  <button id="addBtn">클래스 추가</button>
  <button id="removeBtn">클래스 제거</button>
  <button id="toggleBtn">클래스 토글</button>
  <button id="hasBtn">클래스 존재 여부</button>
  <p id="resultText"></p>
</body>
</html>
