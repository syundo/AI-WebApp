<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <script>
    $(document).ready(function() {
      $("#title").css("color","red");
      $(".title").css("color","blue");
      $("div>div>div").css("color","green");

      // btn1 클릭 이벤트 처리
      $("#btn1").click(function() {
        console.log("btn1");
      });
      // btn2 클릭 이벤트 처리
      $("#btn2").click(function() {
        console.log("btn2");
      });
    });
  </script>
</head>
<body>
  <h1 id="title">jQuery</h1>
  <h1 class="title">jQuery</h1>
  <div>
    <div>
      <div>jQuery</div>
    </div>
  </div>
  <button id="btn1">btn1</button>
  <button id="btn2">btn2</button>
</body>
</html>
